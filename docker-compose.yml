# Local development infrastructure for LearningForge.
# `docker compose up -d` starts Postgres (with pgvector) and Redis.
# `docker compose --profile storage up -d` also starts MinIO (S3-compatible).
# `docker compose --profile pytorch up -d pytorch` starts PyTorch + JupyterLab on the GPU.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lectureforge
      POSTGRES_PASSWORD: lectureforge
      POSTGRES_DB: lectureforge
    ports:
      # Host 5433 (not 5432) so a native/WSL Postgres on 127.0.0.1:5432
      # cannot shadow the container — Docker's 0.0.0.0 bind loses to any
      # process already bound to 127.0.0.1 specifically.
      - "5433:5432"
    volumes:
      - lf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lectureforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lectureforge
      MINIO_ROOT_PASSWORD: lectureforge-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lf_miniodata:/data

  minio-init:
    image: minio/mc:latest
    profiles: ["storage"]
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set lf http://minio:9000 lectureforge lectureforge-dev; do sleep 1; done;
      mc mb --ignore-existing lf/lectureforge;
      mc anonymous set none lf/lectureforge;
      exit 0"

  # PyTorch on the NVIDIA GPU with JupyterLab, for notebooks and experiments
  # (LearningForge itself does not use PyTorch). Open http://127.0.0.1:8888 with
  # the token from `docker compose logs pytorch`. The project folder is
  # /workspace; downloaded models (Hugging Face, torch hub) persist in a volume.
  # It shares the 11 GB GPU with Ollama and Speaches: free Ollama's memory first
  # (Admin > AI model > Free GPU memory) for large models.
  pytorch:
    build: ./deploy/pytorch
    image: learningforge-pytorch:2.14.1-cu126
    profiles: ["pytorch"]
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/workspace
      - lf_torchcache:/root/.cache
    # DataLoader workers share tensors through /dev/shm (64 MB by default).
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  lf_pgdata:
  lf_miniodata:
  lf_torchcache:
